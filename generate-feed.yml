name: Genera Feed Kelkoo

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze
      run: pip install -r requirements.txt

    - name: Esegui script di generazione
      env:
        SHOP_URL: ${{ secrets.SHOP_URL }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      run: python generate_feed.py

    - name: Committa e pubblica il file XML nel repository
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add kelkoo.xml
        git commit -m "Aggiornamento automatico feed Kelkoo" || exit 0
        git push
